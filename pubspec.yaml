name: fluentpet
description: "FluentPet Connect — device management, rebuilt in Flutter against the design system in ../design-system."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  built_collection: ^5.1.1
  dio: ^5.7.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter

  # Generated from the backend's OpenAPI spec — tool/gen_api.sh. Never edited.
  fluentpet_api:
    path: packages/fluentpet_api

  # State and navigation. Phase 1 has no network, no BLE and no auth, so this
  # is the whole dependency list on purpose — see PLAN.md.
  flutter_riverpod: ^3.0.3
  go_router: ^17.2.1
  google_sign_in: ^7.2.0
  phosphor_icons: ^3.0.1
  sentry_flutter: ^9.30.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/licenses/

  # Vendored, not fetched at runtime. The google_fonts package downloads on
  # first paint, which would make phase 1 lie about how the type renders on a
  # cold device — and PLAN.md's whole reason for phase 1 is real type on real
  # hardware. Only the weights tokens/semantic/type.json actually references are
  # shipped: Fraunces 600; Inter 400/500/600; JetBrains Mono 400. All three
  # families are SIL OFL 1.1; the licences ride along in assets/fonts/licenses/.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
